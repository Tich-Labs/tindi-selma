<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Rose Selma Card Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0d0a;
    color: #c9bfb0;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { font-family: 'Georgia', serif; color: #b8956a; font-weight: 300; font-size: 1.8rem; margin-bottom: 0.5rem; }
  h2 { font-family: 'Georgia', serif; color: #e8dece; font-weight: 300; font-size: 1.2rem; margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 0.5px solid #2e271f; }
  label { display: block; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #b8956a; margin-bottom: 0.3rem; margin-top: 1rem; }
  input, textarea {
    width: 100%; padding: 0.7rem 0.9rem;
    background: #1a1410; border: 0.5px solid #3d3020; border-radius: 2px;
    color: #e8dece; font-size: 0.9rem; font-family: inherit;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus { outline: none; border-color: #b8956a; }
  textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; }
  .btn-row { display: flex; gap: 0.8rem; margin-top: 2rem; flex-wrap: wrap; }
  .btn {
    font-family: inherit; font-size: 0.8rem; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.8rem 1.6rem; cursor: pointer; border-radius: 2px;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn-primary {
    background: #b8956a; color: #0f0d0a; border: none;
  }
  .btn-primary:hover { background: #d4a96a; }
  .btn-secondary {
    background: transparent; color: #b8956a; border: 0.5px solid #3d3020;
  }
  .btn-secondary:hover { background: #1a1410; border-color: #b8956a; }
  .msg {
    font-size: 0.8rem; padding: 0.7rem 1rem; border-radius: 2px; margin-top: 1rem;
    text-align: center; letter-spacing: 0.05em;
  }
  .msg-success { background: #1a2a1a; color: #8ab88a; border: 0.5px solid #2a4a2a; }
  .msg-error { background: #2a1a1a; color: #c98a8a; border: 0.5px solid #4a2a2a; }
  .msg-info { background: #1a1a2a; color: #8a8ac9; border: 0.5px solid #2a2a4a; }

  /* Login */
  .login-box {
    max-width: 380px; margin: 6rem auto 0; text-align: center;
    padding: 3rem 2rem; background: #1a1410; border: 0.5px solid #2e271f; border-radius: 2px;
  }
  .login-box h1 { margin-bottom: 1.5rem; }
  .login-box input { text-align: center; margin-bottom: 1rem; }

  .hidden { display: none !important; }

  /* Help text */
  .help { font-size: 0.7rem; color: #5c5040; margin-top: 0.3rem; }

  @media (max-width: 600px) {
    .row, .row-3 { grid-template-columns: 1fr; }
    h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="container" id="loginScreen">
  <div class="login-box">
    <h1>Card Editor</h1>
    <input type="password" id="passInput" placeholder="Enter password" autofocus>
    <button class="btn btn-primary" onclick="doLogin()" style="width:100%">Unlock</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- EDITOR -->
<div class="container hidden" id="editorScreen">
  <h1>Edit Card Content</h1>
  <p style="color:#5c5040; font-size:0.8rem; margin-bottom:0.5rem;">Make changes below, then download the updated card.</p>

  <h2>Page Info</h2>
  <label>Page Title</label>
  <input id="pageTitle" value="Rose Selma Tindi Amadi — Energy Healer &amp; Soul Alignment Facilitator">
  <label>OG Description (for social previews)</label>
  <textarea id="ogDesc">Supporting people through transformation, self-discovery, and deeper alignment with their authentic essence. Energy Healing · Soul Readings · Human Design · Numerology · Astrology · Life Coaching.</textarea>

  <h2>Front — Hero Section</h2>
  <label>Eyebrow / Tagline</label>
  <input id="fEyebrow" value="Soul Alignment · Energy Healing · Intuitive Guidance">
  <div class="row">
    <div><label>Name Line 1</label><input id="fName1" value="Rose Selma"></div>
    <div><label>Name Line 2 (italic)</label><input id="fName2" value="Tindi Amadi"></div>
  </div>
  <div class="row">
    <div><label>Titles Line 1</label><input id="fTitles1" value="Energy Healer · Intuitive Guide"></div>
    <div><label>Titles Line 2</label><input id="fTitles2" value="Soul Alignment Facilitator · Life Coach"></div>
  </div>

  <h2>Front — Stats (3 Pills)</h2>
  <div class="row-3">
    <div><label>Pill 1 Number</label><input id="s1num" value="15+"><label>Pill 1 Label</label><input id="s1label" value="yrs coaching"></div>
    <div><label>Pill 2 Number</label><input id="s2num" value="5+"><label>Pill 2 Label</label><input id="s2label" value="yrs energy healing"></div>
    <div><label>Pill 3 Number</label><input id="s3num" value="3"><label>Pill 3 Label</label><input id="s3label" value="yrs soul alignment"></div>
  </div>

  <h2>Front — Body</h2>
  <label>Body Quote Text</label>
  <textarea id="fBody">Supporting people through transformation, self-discovery, and deeper alignment with their authentic essence.</textarea>

  <label>Pillars / Services (6 items)</label>
  <div class="row-3">
    <div><input id="p1" value="Energetic block clearing"></div>
    <div><input id="p2" value="Soul readings"></div>
    <div><input id="p3" value="Ancestral imprints"></div>
    <div><input id="p4" value="Blueprint awareness"></div>
    <div><input id="p5" value="Human design"></div>
    <div><input id="p6" value="Numerology &amp; astrology"></div>
  </div>

  <label>Intention Label</label>
  <input id="fIntentionLabel" value="My intention for you">
  <label>Intention Quote</label>
  <textarea id="fIntention">"To help create a space where you feel grounded, seen, supported, and energetically open — to receive the full depth of your own healing, remembrance, and transformation."</textarea>

  <h2>Front — Footer</h2>
  <label>Flip Hint Text</label>
  <input id="fHint" value="Tap to read my story">

  <h2>Back — Hero Section</h2>
  <label>Back Eyebrow</label>
  <input id="bEyebrow" value="About Rose Selma">
  <div class="row">
    <div><label>Back Name Line 1</label><input id="bName1" value="Walking alongside you"></div>
    <div><label>Back Name Line 2 (italic)</label><input id="bName2" value="on this journey"></div>
  </div>

  <h2>Back — Bio (4 Paragraphs)</h2>
  <label>Paragraph 1</label>
  <textarea id="bio1">I'm <strong>Rose Selma Tindi Amadi</strong> — an Energy Healer, Intuitive Guide, Soul Alignment Facilitator, and Life Coach with over <strong>15 years of transformative work</strong> supporting people through self-discovery, healing, and deeper alignment.</textarea>
  <label>Paragraph 2</label>
  <textarea id="bio2">My practice weaves together <strong>energy healing, soul readings, and blueprint awareness</strong> — including numerology, astrology, and human design — to help you identify energetic blocks, emotional patterns, and soul-level themes that may be limiting your expansion.</textarea>
  <label>Paragraph 3</label>
  <textarea id="bio3">I also hold space for a community of <strong>200 Awakening Allies</strong>, gathered around healing, empowerment, spiritual growth, and conscious transformation.</textarea>
  <label>Paragraph 4</label>
  <textarea id="bio4">Before and during your journey, my intention is to help you feel <strong>grounded, seen, and energetically open</strong> — so you can receive the full depth of your own remembrance and transformation.</textarea>

  <h2>Back — Tags</h2>
  <div class="row-3">
    <div><input id="t1" value="Energy Healing"></div>
    <div><input id="t2" value="Soul Readings"></div>
    <div><input id="t3" value="Human Design"></div>
    <div><input id="t4" value="Numerology"></div>
    <div><input id="t5" value="Astrology"></div>
    <div><input id="t6" value="Life Coaching"></div>
    <div><input id="t7" value="Ancestral Work"></div>
  </div>

  <h2>Back — Footer</h2>
  <label>Back Flip Hint</label>
  <input id="bHint" value="Tap to flip back">

  <div class="btn-row">
    <button class="btn btn-primary" onclick="generateCard()">Generate &amp; Download</button>
    <button class="btn btn-secondary" onclick="resetForm()">Reset to Defaults</button>
  </div>
  <div id="genMsg"></div>
</div>

<script>
(function() {
  'use strict';

  var PASSWORD_HASH = '';

  function sha256(str) {
    var encoder = new TextEncoder();
    var data = encoder.encode(str);
    return crypto.subtle.digest('SHA-256', data).then(function(buffer) {
      return Array.prototype.map.call(new Uint8Array(buffer), function(x) {
        return ('00' + x.toString(16)).slice(-2);
      }).join('');
    });
  }

  /* Check if already logged in */
  if (sessionStorage.getItem('admin_auth') === '1') {
    showEditor();
  }

  /* Set password hash on first visit or use stored */
  var storedHash = localStorage.getItem('admin_pass_hash');
  if (storedHash) {
    PASSWORD_HASH = storedHash;
  } else {
    /* Default password: tindi2024 — SHA-256 hash */
    sha256('tindi2024').then(function(h) {
      PASSWORD_HASH = h;
      if (!localStorage.getItem('admin_pass_hash')) {
        localStorage.setItem('admin_pass_hash', h);
      }
    });
  }

  /* Ensure hash is set before login */
  function ensureHash(cb) {
    if (PASSWORD_HASH) { cb(); return; }
    var stored = localStorage.getItem('admin_pass_hash');
    if (stored) { PASSWORD_HASH = stored; cb(); return; }
    sha256('tindi2024').then(function(h) {
      PASSWORD_HASH = h;
      localStorage.setItem('admin_pass_hash', h);
      cb();
    });
  }

  window.doLogin = function() {
    var pass = document.getElementById('passInput').value;
    var msg = document.getElementById('loginMsg');
    if (!pass) { msg.innerHTML = '<div class="msg msg-error">Enter a password</div>'; return; }
    ensureHash(function() {
      sha256(pass).then(function(h) {
        if (h === PASSWORD_HASH) {
          sessionStorage.setItem('admin_auth', '1');
          showEditor();
        } else {
          msg.innerHTML = '<div class="msg msg-error">Wrong password</div>';
        }
      });
    });
  };

  document.getElementById('passInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  function showEditor() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('editorScreen').classList.remove('hidden');
  }

  /* --- Generate Card --- */
  window.generateCard = function() {
    var g = function(id) { return document.getElementById(id).value; };

    /* Build title string */
    var pageTitle = g('pageTitle').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var ogDesc = g('ogDesc').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    var fEyebrow = g('fEyebrow');
    var fName1 = g('fName1');
    var fName2 = g('fName2');
    var fTitles1 = g('fTitles1');
    var fTitles2 = g('fTitles2');

    var s1num = g('s1num');
    var s1label = g('s1label');
    var s2num = g('s2num');
    var s2label = g('s2label');
    var s3num = g('s3num');
    var s3label = g('s3label');

    var fBody = g('fBody');
    var p1 = g('p1');
    var p2 = g('p2');
    var p3 = g('p3');
    var p4 = g('p4');
    var p5 = g('p5');
    var p6 = g('p6');
    var fIntentionLabel = g('fIntentionLabel');
    var fIntention = g('fIntention');
    var fHint = g('fHint');

    var bEyebrow = g('bEyebrow');
    var bName1 = g('bName1');
    var bName2 = g('bName2');
    var bio1 = g('bio1');
    var bio2 = g('bio2');
    var bio3 = g('bio3');
    var bio4 = g('bio4');
    var t1 = g('t1');
    var t2 = g('t2');
    var t3 = g('t3');
    var t4 = g('t4');
    var t5 = g('t5');
    var t6 = g('t6');
    var t7 = g('t7');
    var bHint = g('bHint');

    /* Build twitter desc (truncated) */
    var twitterDesc = fBody.length > 120 ? fBody.substring(0, 117) + '...' : fBody;

    var html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n\n';
    html += '<!-- Open Graph / Social Preview -->\n';
    html += '<meta property="og:type" content="profile" />\n';
    html += '<meta property="og:title" content="' + pageTitle + '" />\n';
    html += '<meta property="og:description" content="' + ogDesc + '" />\n';
    html += '<meta property="og:url" content="https://tich-labs.github.io/tindi-selma/" />\n';
    html += '<meta property="og:image" content="https://tich-labs.github.io/tindi-selma/assets/og-image.png" />\n';
    html += '<meta property="og:image:width" content="1200" />\n';
    html += '<meta property="og:image:height" content="630" />\n';
    html += '<meta property="profile:first_name" content="' + fName1 + '" />\n';
    html += '<meta property="profile:last_name" content="' + fName2 + '" />\n\n';
    html += '<!-- Twitter Card -->\n';
    html += '<meta name="twitter:card" content="summary_large_image" />\n';
    html += '<meta name="twitter:title" content="' + pageTitle + '" />\n';
    html += '<meta name="twitter:description" content="' + twitterDesc + '" />\n';
    html += '<meta name="twitter:image" content="https://tich-labs.github.io/tindi-selma/assets/og-image.png" />\n\n';
    html += '<!-- Theme -->\n';
    html += '<meta name="theme-color" content="#0f0d0a" />\n';
    html += '<meta name="apple-mobile-web-app-capable" content="yes" />\n';
    html += '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n\n';
    html += '<title>' + pageTitle + '</title>\n\n';

    /* Now get the template from the page itself */
    var templateEl = document.getElementById('cardTemplate');
    var template = templateEl.value;

    /* Replace content placeholders */
    var placeholders = {
      '{{PAGE_TITLE}}': pageTitle,
      '{{OG_DESC}}': ogDesc,
      '{{TWITTER_DESC}}': twitterDesc,
      '{{F_NAME1}}': fName1,
      '{{F_NAME2}}': fName2,
      '{{F_EYEBROW}}': fEyebrow,
      '{{F_TITLES1}}': fTitles1,
      '{{F_TITLES2}}': fTitles2,
      '{{S1NUM}}': s1num,
      '{{S1LABEL}}': s1label,
      '{{S2NUM}}': s2num,
      '{{S2LABEL}}': s2label,
      '{{S3NUM}}': s3num,
      '{{S3LABEL}}': s3label,
      '{{F_BODY}}': fBody,
      '{{P1}}': p1,
      '{{P2}}': p2,
      '{{P3}}': p3,
      '{{P4}}': p4,
      '{{P5}}': p5,
      '{{P6}}': p6,
      '{{F_INTENTION_LABEL}}': fIntentionLabel,
      '{{F_INTENTION}}': fIntention,
      '{{F_HINT}}': fHint,
      '{{B_EYEBROW}}': bEyebrow,
      '{{B_NAME1}}': bName1,
      '{{B_NAME2}}': bName2,
      '{{BIO1}}': bio1,
      '{{BIO2}}': bio2,
      '{{BIO3}}': bio3,
      '{{BIO4}}': bio4,
      '{{T1}}': t1,
      '{{T2}}': t2,
      '{{T3}}': t3,
      '{{T4}}': t4,
      '{{T5}}': t5,
      '{{T6}}': t6,
      '{{T7}}': t7,
      '{{B_HINT}}': bHint
    };

    for (var key in placeholders) {
      template = template.split(key).join(placeholders[key]);
    }

    var fullHTML = html + template;

    /* Download */
    var blob = new Blob([fullHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(a.href);

    document.getElementById('genMsg').innerHTML = '<div class="msg msg-success">index.html downloaded! Replace the file in your repo and push to update the live card.</div>';
    setTimeout(function() { document.getElementById('genMsg').innerHTML = ''; }, 6000);
  };

  window.resetForm = function() {
    if (confirm('Reset all fields to default values?')) {
      location.reload();
    }
  };
})();
</script>

<!-- Template hidden textarea -->
<textarea id="cardTemplate" style="display:none;" readonly>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="apple-touch-icon" href="assets/favicon.svg" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f0d0a;
    font-family: 'Jost', sans-serif;
    padding: 2rem 1rem;
  }

  .scene {
    width: min(440px, 100%);
    perspective: 1200px;
    cursor: pointer;
  }

  .card-inner {
    width: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .scene.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    width: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 2px;
    overflow: hidden;
  }

  .front {
    position: relative;
  }

  .back {
    position: absolute;
    top: 0; left: 0; right: 0;
    min-height: 100%;
  }

  /* ── HERO ROW ── */
  .card-top {
    position: relative;
    padding: clamp(1.5rem, 5vw, 2.2rem) clamp(1.5rem, 5vw, 2.5rem);
  }
  .hero-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    position: relative;
    z-index: 1;
  }
  .hero-text {
    flex: 1;
    min-width: 0;
  }
  .hero-photo {
    flex: 0 0 110px;
    width: 110px;
    height: 130px;
    border-radius: 8px;
    border: 1.5px solid #b8956a;
    background-color: #1a1410;
    background-size: cover;
    background-position: center 10%;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  /* ── FRONT ── */
  .front { background: #faf7f2; border: 0.5px solid #d9cfc0; }

  .card-top {
    background: #1a1410;
    padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1.5rem, 5vw, 2.5rem) clamp(1.2rem, 4vw, 2rem);
    position: relative;
    overflow: hidden;
  }

  .sacred-bg {
    position: absolute; top: -30px; right: -30px;
    width: clamp(120px, 40%, 180px);
    height: clamp(120px, 40%, 180px);
    opacity: 0.08;
  }

  .eyebrow {
    font-size: clamp(8px, 1.8vw, 10px);
    font-weight: 500; letter-spacing: 0.22em;
    text-transform: uppercase; color: #b8956a;
    margin-bottom: clamp(0.8rem, 3vw, 1.2rem);
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 300; color: #f5efe6;
    line-height: 1.15; margin-bottom: 0.5rem;
  }
  .name em { font-style: italic; }

  .divider-line {
    width: 40px; height: 0.5px;
    background: #b8956a;
    margin: clamp(0.8rem, 3vw, 1.4rem) 0;
  }

  .titles {
    font-size: clamp(9px, 2vw, 11px);
    font-weight: 300; letter-spacing: 0.08em;
    color: #8a7d6d; line-height: 2;
  }

  .card-body {
    padding: clamp(1.2rem, 4vw, 2rem) clamp(1.5rem, 5vw, 2.5rem) clamp(1.5rem, 5vw, 2.5rem);
  }

  .years-row { display: flex; gap: 0; margin-bottom: clamp(1.2rem, 4vw, 1.8rem); }

  .year-pill {
    flex: 1; text-align: center;
    padding: clamp(0.5rem, 2vw, 0.7rem) 0.3rem;
    border: 0.5px solid #d9cfc0;
  }
  .year-pill:not(:last-child) { border-right: none; }

  .year-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 400; color: #3d2e1e;
    display: block; line-height: 1;
  }
  .year-label {
    font-size: clamp(7px, 1.6vw, 9px);
    font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: #9a8c7a;
    display: block; margin-top: 3px;
  }

  .body-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 3.5vw, 16px);
    font-weight: 400; font-style: italic;
    color: #4a3d30; line-height: 1.75;
    margin-bottom: clamp(1.2rem, 4vw, 1.8rem);
  }

  .pillars {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0.4rem;
    margin-bottom: clamp(1.2rem, 4vw, 1.8rem);
  }

  .pillar {
    background: #f0ebe0; border: 0.5px solid #d9cfc0;
    padding: 0.6rem 0.75rem;
    font-size: clamp(9px, 2.2vw, 11px);
    font-weight: 400; color: #5c4a35;
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 6px;
  }
  .pillar-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: #b8956a; flex-shrink: 0;
  }

  .community-bar {
    background: #1a1410;
    padding: clamp(0.7rem, 2.5vw, 0.9rem) clamp(0.9rem, 3vw, 1.2rem);
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: clamp(1.2rem, 4vw, 1.8rem);
  }
  .community-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 400; color: #b8956a;
    line-height: 1; flex-shrink: 0;
  }
  .community-text {
    font-size: clamp(9px, 2vw, 11px);
    font-weight: 300; color: #a89880;
    line-height: 1.5; letter-spacing: 0.05em;
  }

  .intention-block {
    border-left: 1.5px solid #b8956a;
    padding-left: 1rem;
  }
  .intention-label {
    font-size: clamp(7px, 1.8vw, 9px);
    font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: #b8956a;
    margin-bottom: 0.4rem;
  }
  .intention-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 3.2vw, 15px);
    font-style: italic; font-weight: 300;
    color: #5c4a35; line-height: 1.65;
  }

  /* ── BACK ── */
  .back {
    background: #1a1410;
    transform: rotateY(180deg);
    display: flex; flex-direction: column;
    border: 0.5px solid #2e271f;
  }

  .back-top {
    padding: clamp(1.5rem, 5vw, 2.5rem) clamp(1.5rem, 5vw, 2.5rem) 0;
    position: relative; overflow: hidden;
    flex-shrink: 0;
  }

  .back-sacred {
    position: absolute; bottom: -40px; left: -40px;
    width: clamp(140px, 45%, 200px);
    height: clamp(140px, 45%, 200px);
    opacity: 0.05;
  }

  .back-eyebrow {
    font-size: clamp(8px, 1.8vw, 10px);

  .back-name {

  .back-divider {

  .bio-para {

  }

  .bio-para strong {

  }

  .back-tags {

  }

  .tag {
    font-size: clamp(8px, 1.8vw, 9px);
    font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase;

  .back-footer {
    padding: clamp(0.9rem, 3vw, 1.2rem) clamp(1.5rem, 5vw, 2.5rem);

    flex-shrink: 0;
  }

  .flip-hint {
    font-size: clamp(8px, 1.8vw, 10px);
    font-weight: 400; letter-spacing: 0.1em;

    display: flex; align-items: center; gap: 6px;
  }

    width: 16px; height: 16px; opacity: 0.6;

  .back-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(16px, 3.5vw, 18px);
    font-style: italic; color: #b8956a; opacity: 0.7;
  }

  /* Front footer hint */
  .front-footer {
    padding: clamp(0.8rem, 2.5vw, 1rem) clamp(1.5rem, 5vw, 2.5rem);
    border-top: 0.5px solid #d9cfc0;
    display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    background: #faf7f2;
  }

  .front-hint {
    font-size: clamp(8px, 1.8vw, 10px);
    font-weight: 400; letter-spacing: 0.1em;
    color: #b8a898;
    display: flex; align-items: center; gap: 5px;
  }

  /* Share button */
  .share-wrap {
    margin-top: clamp(1rem, 3vw, 1.5rem);
    display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center;
  }

  .share-btn {
    font-family: 'Jost', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: #b8956a; background: transparent;
    border: 0.5px solid #3d3020;
    padding: 0.6rem 1.2rem; cursor: pointer;
    border-radius: 1px;
    transition: background 0.2s, color 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .share-btn:hover { background: #1a1410; color: #d4a96a; }
  .share-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .copied-msg {
    font-size: 10px; color: #b8956a;
    letter-spacing: 0.1em; opacity: 0;
    transition: opacity 0.3s; margin-top: 0.3rem;
    text-align: center; width: 100%;
    font-family: 'Jost', sans-serif;
  }
  .copied-msg.show { opacity: 1; }

  /* Social share icons */
  .share-socials {
    display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
  }
  .share-icon {
    width: 42px; height: 42px; border-radius: 50%;
    border: 0.5px solid #3d3020;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.2s, border-color 0.2s;
    color: #b8956a;
  }
  .share-icon:hover { background: #1a1410; border-color: #b8956a; }
  .share-icon svg { width: 18px; height: 18px; }
  .share-label {
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #5c5040; text-align: center; margin-top: 0.35rem;
    font-family: 'Jost', sans-serif;
  }

  @media (max-width: 480px) {
    .scene { aspect-ratio: 9 / 14.5; }
  }

  /* ── PRINT STYLES ── */
  @media print {
    body {
      background: #fff;
      padding: 0;
      align-items: flex-start;
    }
    .share-wrap, .share-btn, .share-socials, .share-icon, .copied-msg {
      display: none !important;
    }
    .scene {
      width: 100%;
      max-width: 100%;
      cursor: default;
      perspective: none;
    }
    .card-inner {
      transform: none !important;
      transition: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card-face {
      position: relative !important;
      backface-visibility: visible !important;
      -webkit-backface-visibility: visible !important;
      page-break-inside: avoid;
    }
    .back {
      transform: none !important;
      position: relative !important;
      top: auto !important; left: auto !important;
      margin-top: 0.5rem;
    }
    .front-footer, .back-footer {
      display: none;
    }
    @page {
      margin: 0.5cm;
      size: auto;
    }
  }
</style>

<body>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>

<script>
  function toggleFlip() {
    document.getElementById('scene').classList.toggle('flipped');
  }

  document.getElementById('scene').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFlip(); }
  });

  function copyLink() {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(function() {
      const msg = document.getElementById('copiedMsg');
      msg.classList.add('show');
      setTimeout(function() { msg.classList.remove('show'); }, 2500);
    }).catch(function() {
      const msg = document.getElementById('copiedMsg');
      msg.textContent = 'Copy the URL from your address bar';
      msg.classList.add('show');
      setTimeout(function() { msg.classList.remove('show'); }, 2500);
    });
  }

  function shareWhatsApp() {
    var url = encodeURIComponent(window.location.href);
    var text = encodeURIComponent('Rose Selma Tindi Amadi — Energy Healer & Soul Alignment Facilitator');
    window.open('https://wa.me/?text=' + text + '%20' + url, '_blank');
  }

  function shareTwitter() {
    var url = encodeURIComponent(window.location.href);
    var text = encodeURIComponent('Rose Selma Tindi Amadi — Energy Healer & Soul Alignment Facilitator');
    window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + url, '_blank', 'width=600,height=400');
  }

  function shareLinkedIn() {
    var url = encodeURIComponent(window.location.href);
    window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + url, '_blank', 'width=600,height=500');
  }

  function shareFacebook() {
    var url = encodeURIComponent(window.location.href);
    window.open('https://www.facebook.com/sharer/sharer.php?u=' + url, '_blank', 'width=600,height=400');
  }

  function nativeShare() {
    if (navigator.share) {
      navigator.share({
        title: 'Rose Selma Tindi Amadi — Energy Healer & Soul Alignment Facilitator',
        text: 'Supporting people through transformation, self-discovery, and deeper alignment.',
        url: window.location.href
      }).catch(function() {});
    } else {
      copyLink();
    }
  }

  function downloadCard() {
    var html = document.documentElement.outerHTML;
    var blob = new Blob([html], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rose-selma-card.html';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function downloadPDF() {
    window.print();
  }

  /* Register Service Worker for offline support */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/tindi-selma/sw.js').catch(function() {});
    });
  }
</script>
</body>
